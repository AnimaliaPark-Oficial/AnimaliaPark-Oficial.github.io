<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo - Parque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo-app">
        <h1>Mapa Interativo</h1>
    </header>

    <!-- Menu de Filtros Horizontal -->
    <nav class="filtro-horizontal">
        <ul id="legendaListaHorizontal">
            <!-- Preenchido via JavaScript -->
        </ul>
    </nav>

    <!-- Container Principal do Mapa -->
    <main id="mapaContainer" class="mapa-container">
        <div id="mapa" class="mapa-wrapper">
            <img id="imagemMapa" src="" alt="Mapa do Parque">
            <div id="camadaPontos" class="camada-pontos"></div>
        </div>

        <!-- Controles de Zoom Flutuantes -->
        <div class="controles-zoom">
            <button onclick="zoomIn()">+</button>
            <button onclick="zoomOut()">-</button>
            <button onclick="resetZoom()">⌂</button>
        </div>
    </main>

    <!-- Legenda Lateral / Inferior Dinâmica -->
    <aside class="legenda-lateral">
        <div id="conteudoLegendaLateral">
            <!-- Preenchido via JavaScript -->
        </div>
    </aside>

    <!-- Janela Modal de Detalhes do Local -->
    <div id="janelaLocal" class="modal-local" onclick="fecharAoClicarFora(event)">
        <div class="modal-conteudo">
            <button class="botao-fechar" onclick="fecharLocal()">&times;</button>
            <span id="tipoLocal" class="modal-tipo"></span>
            <h2 id="nomeLocal"></h2>
            <p id="areaLocal" class="modal-area"></p>
            <p id="descricaoLocal" class="modal-desc"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
