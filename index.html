<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Interativo - Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- CABEÇALHO DO PARQUE                        -->
    <!-- ========================================== -->
    <header class="header-animalia">
        <div class="logo-container">
            <img src="logo.png" alt="Animália Park" class="logo-central">
        </div>
    </header>

    <!-- ========================================== -->
    <!-- BARRA DE FILTROS SUPERIOR                  -->
    <!-- ========================================== -->
    <nav class="filtros-superior-container">
        <ul class="legenda-lista-horizontal">
            <li>
                <button class="filtro-item active" onclick="filtrar('todos', this)">
                    <img src="icone-todos.png" alt="Todos"> Todos
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('alimentacao', this)">
                    <img src="icone-alimentacao.png" alt="Alimentação"> Alimentação
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('banheiro', this)">
                    <img src="icone-banheiro.png" alt="Banheiros"> Banheiros
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('atracao', this)">
                    <img src="icone-atracao.png" alt="Atrações"> Atrações
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('loja', this)">
                    <img src="icone-loja.png" alt="Lojas"> Lojas
                </button>
            </li>
        </ul>
    </nav>

    <!-- ========================================== -->
    <!-- ÁREA PRINCIPAL DO MAPA                     -->
    <!-- ========================================== -->
    <main id="mapaContainer">

        <!-- PAINEL DE LEGENDA SUSPENSA (FLUTUANTE) -->
        <aside class="painel-legenda-suspensa">
            <h3 class="titulo-legenda">LEGENDA</h3>
            <div id="conteudoLegendaLateral" class="lista-legenda">
                <!-- Itens da legenda inseridos via JavaScript -->
            </div>
        </aside>

        <!-- CONTAINER TRANSFORMÁVEL (ZOOM E PAN) -->
        <div id="mapa">
            <img id="imagemMapa" src="mapa.zoo.webp" alt="Mapa do Parque">
            <div id="camadaPontos">
                <!-- Marcadores renderizados via JavaScript -->
            </div>
        </div>

        <!-- CONTROLES DE ZOOM -->
        <div class="controles-zoom">
            <button onclick="zoomIn()" class="btn-zoom" aria-label="Aumentar zoom">+</button>
            <button onclick="zoomOut()" class="btn-zoom" aria-label="Diminuir zoom">-</button>
            <button onclick="resetZoom()" class="btn-zoom" aria-label="Resetar visão">↺</button>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- MODAL / JANELA DE INFORMAÇÕES DO PONTO     -->
    <!-- ========================================== -->
    <div id="janelaLocal" class="modal-local" onclick="fecharAoClicarFora(event)">
        <div class="modal-conteudo">
            <button class="btn-fechar" onclick="fecharLocal()">×</button>
            <span id="tipoLocal" class="badge-tipo">TIPO</span>
            <h2 id="nomeLocal">Nome do Local</h2>
            <h4 id="areaLocal">Área</h4>
            <div id="descricaoLocal" class="descricao-ponto">
                Descrição detalhada...
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPT PRINCIPAL                           -->
    <!-- ========================================== -->
    <script src="scrypt.js"></script>
</body>
</html>
