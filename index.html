<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Interativo - Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- CABEÇALHO DO PARQUE                        -->
    <!-- ========================================== -->
    <header class="header-animalia">
        <div class="logo-container">
            <img src="logo.png" alt="Animália Park" class="logo-central">
        </div>
    </header>

    <!-- ========================================== -->
    <!-- BARRA DE FILTROS SUPERIOR                  -->
    <!-- ========================================== -->
    <nav class="filtros-superior-container">
        <ul class="legenda-lista-horizontal">
            <li>
                <button class="filtro-item active" onclick="filtrar('todos', this)">
                    <img src="icone-todos.png" alt="Todos"> Todos
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('alimentacao', this)">
                    <img src="icone-alimentacao.png" alt="Alimentação"> Alimentação
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('banheiro', this)">
                    <img src="icone-banheiro.png" alt="Banheiros"> Banheiros
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('atracao', this)">
                    <img src="icone-atracao.png" alt="Atrações"> Atrações
                </button>
            </li>
            <li>
                <button class="filtro-item" onclick="filtrar('loja', this)">
                    <img src="icone-loja.png" alt="Lojas"> Lojas
                </button>
            </li>
        </ul>
    </nav>

    <!-- ========================================== -->
    <!-- CONTEÚDO PRINCIPAL (MAPA)                  -->
    <!-- ========================================== -->
    <main class="layout-principal">
        
        <!-- Painel de Legenda Lateral Retrátil (Canto Superior Esquerdo) -->
        <aside class="painel-legenda-lateral">
            <details class="legenda-detalhes" open>
                <summary>Legenda</summary>
                <div class="legenda-corpo-conteudo" id="listaLegendaLateral">
                    <!-- Preenchido dinamicamente pelo JavaScript -->
                </div>
            </details>
        </aside>

        <!-- Container de Arraste e Zoom -->
        <div class="mapa-container" id="mapaContainer">
            <div class="mapa" id="conteudoMapa">
                <img id="imagemMapa" src="mapa.zoo.webp" alt="Mapa Animália Park">
                <div id="camadaPontos"></div>
            </div>
        </div>

        <!-- Controles Flutuantes de Zoom -->
        <div class="zoom-controls">
            <button onclick="ajustarZoom(0.2)">+</button>
            <button onclick="ajustarZoom(-0.2)">-</button>
            <button onclick="resetZoom()">⟲</button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- MODAL DE DETALHES DO LOCAL                 -->
    <!-- ========================================== -->
    <div class="janela" id="janelaLocal" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharModal()">&times;</button>
            <h2 id="modalTitulo">Nome do Local</h2>
            <h3 id="modalCategoria">Categoria</h3>
            <p id="modalDescricao">Descrição detalhada do ponto selecionado no parque.</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS E DADOS DO PARQUE                  -->
    <!-- ========================================== -->
    <script>
        const dadosPark = {
            reserva: {
                pontos: [
                    { id: 1, nome: "Restaurante Principal", categoria: "alimentacao", top: 45, left: 50, icone: "icone-alimentacao.png", descricao: "Variedade de pratos quentes e lanches." },
                    { id: 2, nome: "Sanitários Norte", categoria: "banheiro", top: 30, left: 40, icone: "icone-banheiro.png", descricao: "Banheiros masculinos, femininos e acessíveis." },
                    { id: 3, nome: "Área dos Tigres", categoria: "atracao", top: 60, left: 70, icone: "icone-atracao.png", descricao: "Observação dos tigres de bengala." },
                    { id: 4, nome: "Loja de Souvenirs", categoria: "loja", top: 25, left: 55, icone: "icone-loja.png", descricao: "Lembranças exclusivas do Animália Park." }
                ]
            }
        };

        function filtrar(categoria, botaoElemento) {
            document.querySelectorAll('.filtro-item').forEach(btn => btn.classList.remove('active'));
            if(botaoElemento) botaoElemento.classList.add('active');
            renderizarPontos(categoria);
        }

        function renderizarPontos(categoriaFiltro) {
            const camada = document.getElementById("camadaPontos");
            if (!camada) return;
            camada.innerHTML = "";

            let pontosDaLegenda = [];

            if (window.dadosPark && dadosPark.reserva && dadosPark.reserva.pontos) {
                dadosPark.reserva.pontos.forEach(ponto => {
                    if (categoriaFiltro === 'todos' || ponto.categoria === categoriaFiltro) {
                        const el = document.createElement("div");
                        el.className = "ponto";
                        el.style.top = ponto.top + "%";
                        el.style.left = ponto.left + "%";
                        
                        el.innerHTML = `<img src="${ponto.icone}" alt="${ponto.nome}" class="icone-marcador" style="width: 24px; height: 24px; object-fit: contain;">`;

                        el.onclick = (e) => { 
                            e.stopPropagation(); 
                            abrirLocal(ponto); 
                        };

                        camada.appendChild(el);
                        pontosDaLegenda.push(ponto);
                    }
                });
            }

            atualizarLegendaLateral(pontosDaLegenda);
        }

        function atualizarLegendaLateral(pontos) {
            const containerLegenda = document.getElementById("listaLegendaLateral");
            if (!containerLegenda) return;

            containerLegenda.innerHTML = "";
            pontos.forEach(ponto => {
                const item = document.createElement("div");
                item.className = "item-legenda-visual";
                item.innerHTML = `<img src="${ponto.icone}" alt=""> <span>${ponto.nome}</span>`;
                item.onclick = () => abrirLocal(ponto);
                containerLegenda.appendChild(item);
            });
        }

        function abrirLocal(ponto) {
            document.getElementById("modalTitulo").innerText = ponto.nome;
            document.getElementById("modalCategoria").innerText = ponto.categoria.toUpperCase();
            document.getElementById("modalDescricao").innerText = ponto.descricao;
            document.getElementById("janelaLocal").classList.add("ativa");
        }

        function fecharModal() {
            document.getElementById("janelaLocal").classList.remove("ativa");
        }

        function fecharAoClicarFora(event) {
            const janela = document.getElementById('janelaLocal');
            if (event.target === janela) fecharModal();
        }

        let scale = 1;
        function ajustarZoom(fator) {
            scale = Math.min(Math.max(scale + fator, 0.2), 3.0);
            const conteudoMapa = document.getElementById("conteudoMapa");
            if (conteudoMapa) {
                conteudoMapa.style.transform = `scale(${scale})`;
            }
        }

        function resetZoom() {
            scale = 1;
            const conteudoMapa = document.getElementById("conteudoMapa");
            if (conteudoMapa) {
                conteudoMapa.style.transform = `scale(1)`;
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderizarPontos('todos');
        });
    </script>
</body>
</html>
