<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Animália Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-animalia">
        <!-- Caixinha de Progresso posicionada na barra superior roxa -->
        <div id="painel-progresso">
            📍 Progresso: <span id="progressoTexto">Aguardando GPS...</span>
        </div>
    </header>

    <div class="logo-container-central">
        <img src="logo-animalia.png" alt="Animália Park Logo" class="logo-central-3d">
    </div>

    <nav class="filtros-superior-container">
        <ul id="legendaListaHorizontal" class="legenda-lista-horizontal"></ul>
    </nav>

    <main class="layout-principal">
        <div id="mapaContainer" class="mapa-container">
            
            <!-- CAIXINHA DE LEGENDA SUSPENSA -->
            <div class="painel-legenda-lateral">
                <details class="legenda-detalhes">
                    <summary>LEGENDA</summary>
                    <div id="conteudoLegendaLateral" class="legenda-corpo-conteudo">
                        <!-- Atualizado dinamicamente via JS -->
                    </div>
                </details>
            </div>

            <!-- O MAPA -->
            <div id="mapa" class="mapa">
                <img id="imagemMapa" src="mapa.zoo.webp" alt="Mapa do Parque">
                <div id="camadaPontos"></div>

                <!-- Círculo de precisão do GPS (desenhado pelo script.js) -->
                <div id="user-precisao" class="circulo-precisao"></div>
                
                <!-- O marcador de geolocalização ajustado e pulsando -->
                <div id="user-marker" style="position: absolute; width: 45px; height: 45px; display: none; z-index: 9999; pointer-events: none;">
                    <!-- Anel que pulsa -->
                    <div style="position: absolute; width: 100%; height: 100%; background-color: rgba(239, 68, 68, 0.4); border-radius: 50%; top: 0; left: 0; animation: user-pulse-red 1.8s infinite ease-out;"></div>
                    <!-- Emoji do Pin centralizado -->
                    <div style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">📍</div>
                </div>
            </div>

            <!-- CONTROLES DE ZOOM -->
            <div class="zoom-controls">
                <button onclick="zoomIn()" aria-label="Aumentar Zoom">+</button>
                <button onclick="zoomOut()" aria-label="Diminuir Zoom">−</button>
                <button onclick="resetZoom()" aria-label="Resetar Zoom">⟲</button>
                <button onclick="centralizarNoUsuario()" aria-label="Ir para a minha localização">📍</button>
            </div>

        </div>
    </main>
                        <!-- NOVO - BOTÃO DE SUGESTÃO -->        
    <a class="botao-sugestoes" href="/PainelAtendimento/" target="_blank" rel="noopener">
        <span aria-hidden="true">💬</span> Sugestões e Elogios
    </a>
             
    <div id="janelaLocal" class="janela" onclick="fecharAoClicarFora(event)">
        <div class="conteudo">
            <div class="barra-arraste"></div>
            <button class="fechar" onclick="fecharLocal()" aria-label="Fechar">&times;</button>
            <h3 id="tipoLocal"></h3>
            <h2 id="nomeLocal"></h2>
            <p id="areaLocal" style="font-weight: bold; margin-bottom: 8px;"></p>
            <p id="descricaoLocal"></p>
        </div>
    </div>

    <script src="rota.js"></script>
    <script src="script.js"></script>
</body>
</html>
